services:
  memviz:
    image: memviz-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memviz
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      MEMVIZ_DEFAULT_REDIS_HOST: redis
      MEMVIZ_DEFAULT_REDIS_PORT: "6379"
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    container_name: memviz-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
